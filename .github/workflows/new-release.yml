name: New Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag release baru (contoh: v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Nama release (opsional)"
        required: false
        type: string
      prerelease:
        description: "Tandai sebagai pre-release"
        required: false
        default: false
        type: boolean
      generate_notes:
        description: "Gunakan auto-generated release notes"
        required: false
        default: true
        type: boolean
      make_latest:
        description: "Jadikan release sebagai latest"
        required: false
        default: true
        type: boolean

  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          GENERATE_NOTES: ${{ inputs.generate_notes }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            release_name="Release ${tag}"
            prerelease="false"
            generate_notes="true"
            make_latest="true"
          else
            tag="$TAG_NAME"
            release_name="${RELEASE_NAME:-Release ${tag}}"
            prerelease="$PRERELEASE"
            generate_notes="$GENERATE_NOTES"
            make_latest="$MAKE_LATEST"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag harus mengikuti format semantic version, contoh: v1.2.3 atau v1.2.3-beta.1"
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "release_name=${release_name}"
            echo "prerelease=${prerelease}"
            echo "generate_notes=${generate_notes}"
            echo "make_latest=${make_latest}"
            echo "artifact=${tag}-repository.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} sudah ada di remote; melanjutkan pembuatan release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create repository archive
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          set -euo pipefail
          git archive --format=zip --output="$ARTIFACT" "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: ${{ steps.meta.outputs.generate_notes }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: ${{ steps.meta.outputs.artifact }}